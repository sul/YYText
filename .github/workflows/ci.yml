name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-framework:
    name: Framework
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Framework
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Framework/YYText.xcodeproj \
            -scheme YYText \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  build-spm:
    name: Swift Package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Swift Package
        run: |
          set -o pipefail
          xcodebuild clean build \
            -scheme YYText \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .ci/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  lint-podspec:
    name: CocoaPods
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint podspec
        run: pod lib lint YYText.podspec --allow-warnings --skip-tests --quick
